name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  helpers:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/build-helper.mjs

  publish:
    needs: helpers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Example-Org/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .

      - name: Install
        run: npm ci

      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public
