name: Cross-check

# Runs every runner and requires IDENTICAL VERDICTS.
#
# Three suites that each went green on their own are three claims. This job is
# the comparison, and it is the only thing here that can catch a port being
# green against a corpus it never actually loaded — or against a stale copy of
# one. scripts/cross-check.mjs FAILS when a runner declared in parity/ledger.json
# is missing rather than skipping it, because a cross-check that quietly drops a
# runner reports agreement between however many happened to be present.

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:
  # The ports move on their own schedule, so a corpus that was green on Monday
  # can be red on Tuesday without anything here changing.
  schedule:
    - cron: "0 7 * * *"
  # This job's inputs are three repositories, and only one of them can trigger
  # it by pushing. Being able to run it on demand — after a port merges
  # something — is the difference between finding a divergence now and finding
  # it at 07:00 tomorrow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-check:
    name: All runners agree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout prism-parity
        uses: actions/checkout@v4
        with:
          path: prism-parity

      # The PHP reference is checked out for the same reason the two ports are:
      # so the runner tests the TREE. It used to install the published package
      # from Packagist, which made it the only one of three asserting against a
      # snapshot -- so goldens generated from the tree could not be verified
      # until a release, and a reference change silently could not be checked at
      # all in between.
      - name: Checkout prism
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism
          path: prism

      - name: Checkout prism-ts
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-ts
          path: prism-ts

      - name: Checkout prism-py
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-py
          path: prism-py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Build the PHP reference runner
        working-directory: prism-parity/runners/php
        run: composer install --no-interaction --no-progress

      # NOTE THE ORDER. The loader is installed LAST in each port, because a
      # --no-save npm install leaves it extraneous and any later npm install
      # prunes it. Same family as caret-pinning a 0.x conformance dependency:
      # the mechanism is correct and silently not running.
      - name: Build prism-ts
        working-directory: prism-ts
        run: |
          npm ci
          npm run build
          npm install ../prism-parity/loaders/ts --no-save

      - name: Build prism-py
        working-directory: prism-py
        run: |
          python -m pip install --quiet -e .
          python -m pip install --quiet ../prism-parity/loaders/py

      - name: Cross-check
        working-directory: prism-parity
        run: node scripts/cross-check.mjs
