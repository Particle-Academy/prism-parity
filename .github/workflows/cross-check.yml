            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '


      - name: Gate every tree before installing
        run: |
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-parity
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-mcp
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-mcp-ts
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-mcp-py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install canonical validator
        working-directory: prism-parity
        run: npm ci
      - name: Verify and execute normally published MCP packages
        working-directory: prism-parity
        run: node tools/mcp-behavior/published.mjs
      - name: Keep published MCP runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-published-runtime
          path: |
            prism-parity/.mcp-published/report.json
            prism-parity/.mcp-published/*.log
            prism-parity/.mcp-published/php/vendor/particle-academy/prism-mcp/
            prism-parity/.mcp-published/ts/node_modules/@particle-academy/prism-mcp/dist/
            prism-parity/.mcp-published/py/**/prism_mcp/**
          # The verified PHP export includes its public .gitattributes file.
          # Only these known public SDK directories and synthetic logs are kept.
          include-hidden-files: true
          if-no-files-found: error

  # Candidate source only; normally published PHP regeneration is required.
  # Gate exact source trees on Linux before any OS installs dependencies.
  # A separate required job avoids multi-command PowerShell exit masking.
  satellite-guard:
    name: Satellite source allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: prism-parity
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-browser
          ref: a7d2a915ef70840e325e9c0f06319b2994b13c9f
          path: prism-browser
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-browser-ts
          ref: 8380640802cf48240ac83659a36385504fcde4c0
          path: prism-browser-ts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-browser-py
          ref: 9af7c808aaa8d842854dbef009b803b2f323eecb
          path: prism-browser-py
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-human-plus
          ref: 6b69d530f52bf904a7ce9a337bc56678f89c69d0
          path: prism-human-plus
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-human-plus-ts
          ref: 9220fcd398ef50e37d453be284a92495e0b76a99
          path: prism-human-plus-ts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-human-plus-py
          ref: fbbdf840b4efafa08731af6a2ea7df90f4285f58
          path: prism-human-plus-py
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          PIN_SHA256: |
            b6ce9746345825e37beb9655e1b124c706cf5451e960b7ee3e548fa3a086f706  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            720d6d7393e943c599dab248511b8e89f29d51993c31cfaf7bda9292638b74e3  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Gate every source tree before installs
        run: |
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-parity
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-browser
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-browser-ts
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-browser-py
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-human-plus
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-human-plus-ts
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-human-plus-py

  satellite-candidate:
    needs: satellite-guard
    name: Satellite published (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: prism-parity
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-browser
          ref: a7d2a915ef70840e325e9c0f06319b2994b13c9f
          path: prism-browser
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-browser-ts
          ref: 8380640802cf48240ac83659a36385504fcde4c0
          path: prism-browser-ts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-browser-py
          ref: 9af7c808aaa8d842854dbef009b803b2f323eecb
          path: prism-browser-py
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-human-plus
          ref: 6b69d530f52bf904a7ce9a337bc56678f89c69d0
          path: prism-human-plus
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-human-plus-ts
          ref: 9220fcd398ef50e37d453be284a92495e0b76a99
          path: prism-human-plus-ts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-human-plus-py
          ref: fbbdf840b4efafa08731af6a2ea7df90f4285f58
          path: prism-human-plus-py
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring
          coverage: none
      - name: Install canonical validator
        working-directory: prism-parity
        shell: bash
        run: npm ci
      - name: Build prism-browser-ts
        working-directory: prism-browser-ts
        shell: bash
        run: |
          npm ci --ignore-scripts
          node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: Build prism-human-plus-ts
        working-directory: prism-human-plus-ts
        shell: bash
        run: |
          npm ci --ignore-scripts
          node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: Validate native satellite evidence contract
        working-directory: prism-parity
        shell: bash
        run: node tools/run-gate.mjs nodeTests -- node --test tools/satellite-policy-schema.test.mjs tools/satellite-policy-published-schema.test.mjs
      - name: Check normal published SDK artifacts in all languages
        working-directory: prism-parity
        shell: bash
        run: node tools/satellite-policy/published.mjs
      - name: Keep published runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-published-${{ matrix.os }}
          include-hidden-files: true
          path: |
            prism-parity/.satellite-published/*.json
            prism-parity/.satellite-published/*.log
          if-no-files-found: error
