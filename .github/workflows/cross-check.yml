name: Cross-check

# Runs every runner and requires IDENTICAL VERDICTS.
#
# Three suites that each went green on their own are three claims. This job is
# the comparison, and it is the only thing here that can catch a port being
# green against a corpus it never actually loaded — or against a stale copy of
# one. scripts/cross-check.mjs FAILS when a runner declared in parity/ledger.json
# is missing rather than skipping it, because a cross-check that quietly drops a
# runner reports agreement between however many happened to be present.

on:
  # Alignment owns push, daily and manual triggers and runs before this job.
  workflow_call:

permissions:
  contents: read

jobs:
  cross-check:
    name: All runners agree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout prism-parity
        uses: actions/checkout@v4
        with:
          path: prism-parity

      - name: Checkout prism-ts
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-ts
          path: prism-ts

      - name: Checkout prism-py
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-py
          path: prism-py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # THREE TREES, THREE GATES, and none of them is this repository. This job
      # installs the reference runner's dependencies, then prism-ts's, then
      # prism-py's — three separate manifests in three checkouts. prism-parity
      # itself has no root manifest, so a single `--repo .` would examine
      # nothing and render green beside all three installs.
      #
      # The ports gate themselves in their own CI. This is the copy that stands
      # where THIS install happens, which is the only place it can stop one.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist (all three trees)
        run: |
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-parity/runners/php
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-ts
          node prism-parity/tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo prism-py
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Build the PHP reference runner
        working-directory: prism-parity/runners/php
        run: composer install --no-interaction --no-progress

      # NOTE THE ORDER. The loader is installed LAST in each port, because a
      # --no-save npm install leaves it extraneous and any later npm install
      # prunes it. Same family as caret-pinning a 0.x conformance dependency:
      # the mechanism is correct and silently not running.
      - name: Build prism-ts
        working-directory: prism-ts
        run: |
          npm ci
          npm run build
          npm install ../prism-parity/loaders/ts --no-save

      - name: Build prism-py
        working-directory: prism-py
        run: |
          python -m pip install --quiet -e .
          python -m pip install --quiet ../prism-parity/loaders/py

      - name: Cross-check
        working-directory: prism-parity
        run: node tools/run-gate.mjs crossCheck -- node scripts/cross-check.mjs
