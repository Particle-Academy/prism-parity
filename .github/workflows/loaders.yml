name: Loaders

# All three loader jobs are required, and each is a separate job on purpose.
#
# A loader whose tests run nowhere is a claim about coverage rather than
# coverage. Elsewhere, an AGENTS.md said "all four are required CI jobs" while
# ci.yml had three — the Python loader and its 27 tests ran nowhere at all, in
# the repository whose entire argument is that such a claim must be a test
# result rather than a sentence.
#
# If a fourth loader is added, it gets a job here. tools/parity-check.mjs
# DISCOVERS the languages in play and fails when one is not declared, so a
# forgotten loader cannot sit here quietly untested.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: loader / php
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      # Dependency-free on purpose: a test suite that needs a toolchain nobody
      # installed is a test suite that runs nowhere.
      - name: Loader tests
        working-directory: loaders/php
        run: node ../../tools/run-gate.mjs phpTests -- php tests/run.php

  ts:
    name: loader / ts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Loader tests
        working-directory: loaders/ts
        run: node ../../tools/run-gate.mjs nodeTests -- node --test --test-reporter=tap test/loader.test.js

  py:
    name: loader / py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Gated against the tree the install comes FROM, which is `loaders/py`
      # and not this repository's root. prism-parity has no root manifest, so
      # `--repo .` here would report "0 direct dependencies, all approved" —
      # examining nothing and rendering green. The org checker now fails that
      # outright rather than passing it, but the reason this points at
      # loaders/py is that loaders/py is where the dependencies are declared.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo loaders/py
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From the manifest, not from three names typed here. The tooling used to
      # be installed by name with nothing declaring it, which is what made the
      # gate above impossible to point anywhere useful.
      - name: Install tooling
        run: python -m pip install --quiet "./loaders/py[dev]"

      - name: Loader tests
        working-directory: loaders/py
        env:
          PYTHONPATH: src
        run: node ../../tools/run-gate.mjs pythonTests -- python -m pytest tests -q

      - name: Types
        working-directory: loaders/py
        run: node ../../tools/run-gate.mjs mypy -- python -m mypy --strict src

      - name: Lint
        working-directory: loaders/py
        run: node ../../tools/run-gate.mjs ruff -- python -m ruff check .
