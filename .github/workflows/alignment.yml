name: Alignment

on:
  push:
    branches: [main, "*.x"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: read

jobs:
  alignment:
    name: Validate evidence before gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Alignment assertions and regression tests
        run: node tools/alignment.mjs
      - name: This checkout pins the shared checks
        run: node tools/run-gate.mjs pins -- node tools/pin-github-checks.mjs --check --repo .
      - name: Live repository and registry catalog currency
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/run-gate.mjs catalog -- node tools/catalog-currency.mjs --check
      - name: Live organization shared-check inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/run-gate.mjs pinInventory -- node tools/scan-github-checks.mjs --check
      - name: Candidate copies and external public main claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/run-gate.mjs remote -- node tools/remote-alignment.mjs

  corpus:
    needs: alignment
    uses: ./.github/workflows/corpus.yml
  cross-check:
    needs: alignment
    uses: ./.github/workflows/cross-check.yml
  loaders:
    needs: alignment
    uses: ./.github/workflows/loaders.yml
  factcheck:
    needs: alignment
    uses: ./.github/workflows/factcheck.yml
  schema:
    needs: alignment
    uses: ./.github/workflows/schema.yml
  release-notes:
    needs: alignment
    uses: ./.github/workflows/release-notes.yml
