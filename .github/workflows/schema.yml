name: Cases schema

# Reusable only: the alignment coordinator owns triggers, so this gate cannot
# run -- or report -- independently of the evidence check that precedes it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false
      - name: Root dependency allowlist
        run: node tools/run-gate.mjs allowlist -- node .third-party-allowlist/third-party/check.mjs --repo .
      - run: npm ci
      - name: Gate rejects invalid documents
        run: npm run test:schema
      - name: Validate every case document
        run: npm run validate:cases
